# cross-rs container setup for local aarch64 builds. The tagged
# (xenial-based) images ship libclang 3.8 / gcc 5.4 — too old for
# bindgen and whisper.cpp's C++17 — so use the focal-based :main
# image, which carries gcc-9 and a modern libclang. CI builds
# aarch64 directly in an ubuntu:24.04 container instead (see
# .github/workflows/release.yml).

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update -y",
    "apt-get install -y --no-install-recommends cmake pkg-config clang libclang-dev libasound2-dev:arm64",
]

[build.env]
passthrough = [
    "LIBCLANG_PATH",
    "BINDGEN_EXTRA_CLANG_ARGS",
    "CMAKE_TOOLCHAIN_FILE_aarch64_unknown_linux_gnu",
]
