app-id: org.tycho.Tycho
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: tycho

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=session-bus
  - --talk-name=org.kde.KWin
  - --talk-name=org.mpris.MediaPlayer2.*
  - --filesystem=xdg-run/hypr:ro
  - --filesystem=~/.local/share/tycho:create
  - --share=network
  - --share=ipc

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  env:
    CARGO_HOME: /run/build/tycho/cargo
    # whisper-rs-sys runs bindgen — point clang-sys at the LLVM ext.
    LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib

modules:
  - name: tycho
    buildsystem: simple
    build-commands:
      # cargo-sources.json vendors the whole dependency tree and installs
      # a vendored-sources cargo config — the builder has no network.
      - cargo build --release --offline --features all-desktops
      - install -Dm755 target/release/tycho /app/bin/tycho
      - install -Dm644 packaging/flatpak/org.tycho.Tycho.desktop /app/share/applications/org.tycho.Tycho.desktop
      - install -Dm644 packaging/flatpak/org.tycho.Tycho.metainfo.xml /app/share/metainfo/org.tycho.Tycho.metainfo.xml
      - install -Dm644 packaging/flatpak/org.tycho.Tycho.svg /app/share/icons/hicolor/scalable/apps/org.tycho.Tycho.svg
    sources:
      - type: dir
        path: ../../
      # Regenerate with flatpak-builder-tools:
      #   flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - cargo-sources.json
