# Cargo deny configuration

[advisories]
# Any vulnerability fails the gate; informational advisories
# (unmaintained/unsound) surface as warnings by default.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained but only reached through fontdue (UI
    # text rasterizer); there is no drop-in upgrade — skrifa would
    # require replacing fontdue outright.
    "RUSTSEC-2026-0192",
]

[licenses]
# Schema v2: crates with no license expression are denied by default.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
