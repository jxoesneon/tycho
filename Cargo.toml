[package]
name = "tycho"
version = "0.3.0"
edition = "2021"
rust-version = "1.88.0"
authors = ["Jose Eduardo Rojas Jimenez <jxoesneon>"]
description = "Tycho: Autonomous low-latency voice assistant for Linux Wayland compositors (Hyprland, KDE Plasma) built in Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/jxoesneon/tycho"
homepage = "https://github.com/jxoesneon/tycho"
documentation = "https://docs.rs/tycho"
keywords = ["voice-assistant", "wayland", "hyprland", "kde", "onnx"]
categories = ["accessibility", "command-line-utilities", "multimedia::audio"]
exclude = [
    ".github/",
    "packaging/",
    "docs/",
    "tests/fixtures/",
    "*.tmp*",
]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
zbus = { version = "5", features = ["tokio"], optional = true }
cpal = "0.18"
hound = "3.5"
whisper-rs = "0.16"

# Orb overlay UI — pure Rust; `dlopen` keeps libwayland a runtime-only dep.
wayland-client = { version = "0.31", features = ["dlopen"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
tiny-skia = { version = "0.12", optional = true }
memfd = { version = "0.6", optional = true }
fontdue = { version = "0.9", optional = true }
xkbcommon-dl = { version = "0.4", optional = true }

[features]
default = ["all-desktops", "orb"]
hyprland = []
kde = ["dep:zbus"]
all-desktops = ["hyprland", "kde"]
orb = [
    "dep:wayland-client",
    "dep:wayland-protocols-wlr",
    "dep:tiny-skia",
    "dep:memfd",
    "dep:fontdue",
    "dep:xkbcommon-dl",
]

[dev-dependencies]
tokio-test = "0.4"

# Backend-specific integration tests only build when their compositor
# feature (and its optional deps) is enabled.
[[test]]
name = "env_tests"
path = "tests/env_tests.rs"
required-features = ["all-desktops"]

[[test]]
name = "hyprland_ipc_tests"
path = "tests/hyprland_ipc_tests.rs"
required-features = ["hyprland"]

[[test]]
name = "kde_tests"
path = "tests/kde_tests.rs"
required-features = ["kde"]

[[test]]
name = "ui_tests"
path = "tests/ui_tests.rs"
required-features = ["orb"]

# Orb/UI examples only build with the orb feature (Wayland deps).
[[example]]
name = "orb_demo"
required-features = ["orb"]

[[example]]
name = "orb_input_demo"
required-features = ["orb"]

[[example]]
name = "render_states"
required-features = ["orb"]

[[bin]]
name = "tycho"
path = "src/main.rs"

[lib]
name = "rust_voice_assistant"
path = "src/lib.rs"

[package.metadata.deb]
name = "tycho"
maintainer = "Jose Eduardo Rojas Jimenez <jxoesneon@users.noreply.github.com>"
copyright = "2026 Jose Eduardo Rojas Jimenez"
license-file = ["LICENSE-MIT", "4"]
extended-description = "Tycho is an autonomous, low-latency Linux desktop voice assistant engineered for Hyprland Wayland and KDE Plasma compositors."
section = "sound"
priority = "optional"
depends = "$auto, libasound2"
assets = [
    ["target/release/tycho", "usr/bin/tycho", "755"],
    ["systemd/tycho.service", "usr/lib/systemd/user/tycho.service", "644"],
    ["packaging/flatpak/org.tycho.Tycho.desktop", "usr/share/applications/org.tycho.Tycho.desktop", "644"],
    ["README.md", "usr/share/doc/tycho/README.md", "644"],
]
