name: Release Automation & Multi-Target Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
            archive_suffix: "linux-x86_64"
          # musl is intentionally absent: cpal/alsa-sys cannot link a
          # musl target without an alsa-lib built for musl, which the
          # cross containers do not ship.
          - target: aarch64-unknown-linux-gnu
            use_cross: true
            archive_suffix: "linux-aarch64"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install System Build Dependencies (Native GNU)
        if: ${{ !matrix.use_cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config cmake clang libclang-dev
      - name: Build Binary (Native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --features all-desktops
      - name: Build Binary (Cross)
        if: ${{ matrix.use_cross }}
        # Ubuntu 24.04 container: clang-18/libclang for bindgen and gcc-13
        # for whisper.cpp's C++17 — cross@0.2.5's xenial image is too old.
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:24.04 \
            bash -euxo pipefail -c '
              dpkg --add-architecture arm64 &&
              apt-get update -y &&
              apt-get install -y --no-install-recommends \
                curl ca-certificates build-essential pkg-config cmake clang libclang-dev \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libasound2-dev:arm64 &&
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal &&
              . "$HOME/.cargo/env" &&
              rustup target add aarch64-unknown-linux-gnu &&
              export LIBCLANG_PATH="$(dirname "$(find /usr/lib -name 'libclang.so*' | head -1)")" \
                     CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
                     BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu" \
                     PKG_CONFIG_ALLOW_CROSS=1 \
                     PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
                     CMAKE_TOOLCHAIN_FILE_aarch64_unknown_linux_gnu=/src/docker/aarch64-linux-gnu.cmake &&
              cargo build --release --target ${{ matrix.target }} --features all-desktops
            '
      - name: Strip Binary
        run: |
          if [ -f target/${{ matrix.target }}/release/tycho ]; then
            strip target/${{ matrix.target }}/release/tycho || true
          fi
      - name: Assemble Release Bundle Archive
        run: |
          VERSION=${GITHUB_REF_NAME:-v0.2.0}
          BUNDLE_NAME="tycho-${VERSION}-${{ matrix.archive_suffix }}"
          mkdir -p dist/${BUNDLE_NAME}/bin
          mkdir -p dist/${BUNDLE_NAME}/systemd
          mkdir -p dist/${BUNDLE_NAME}/completions
          mkdir -p dist/${BUNDLE_NAME}/packaging
          cp target/${{ matrix.target }}/release/tycho dist/${BUNDLE_NAME}/bin/
          cp systemd/tycho.service dist/${BUNDLE_NAME}/systemd/
          cp completions/* dist/${BUNDLE_NAME}/completions/
          cp -r packaging/flatpak dist/${BUNDLE_NAME}/packaging/
          cp README.md dist/${BUNDLE_NAME}/
          cp LICENSE-MIT dist/${BUNDLE_NAME}/
          tar -czvf "dist/${BUNDLE_NAME}.tar.gz" -C dist "${BUNDLE_NAME}"
          cd dist && sha256sum "${BUNDLE_NAME}.tar.gz" > "${BUNDLE_NAME}.tar.gz.sha256"
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/tycho-*.tar.gz*

  build-deb:
    name: Build Debian (.deb) Package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config cmake clang libclang-dev
          cargo install --locked cargo-deb
      - name: Build .deb Package
        run: |
          cargo deb --target x86_64-unknown-linux-gnu
          mkdir -p dist-deb
          cp target/x86_64-unknown-linux-gnu/debian/*.deb dist-deb/
          cd dist-deb && sha256sum *.deb > SHA256SUMS-deb
      - name: Upload Debian Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist-deb/*

  build-flatpak:
    name: Build Flatpak Package
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Build Flatpak Bundle via flatpak-builder
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Tycho.flatpak
          manifest-path: packaging/flatpak/org.tycho.Tycho.yml
          run-tests: false
          stop-at-build-fail: true
      - name: Generate Flatpak Checksum
        run: sha256sum Tycho.flatpak > Tycho.flatpak.sha256
      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: |
            Tycho.flatpak
            Tycho.flatpak.sha256

  publish-crates-io:
    name: Publish to Crates.io
    needs: [build-binaries]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish Package to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish --verbose
          else
            echo "::warning ::CRATES_IO_TOKEN not configured in repository secrets. Skipping crates.io publication."
          fi

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-binaries, build-deb, build-flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Collate Release Assets & Generate SHA256SUMS
        run: |
          mkdir -p release-final
          find release-assets/ -type f \( -name "*.tar.gz" -o -name "*.deb" -o -name "*.flatpak" \) -exec cp {} release-final/ \;
          cd release-final
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-final/*
          draft: false
          prerelease: false
          generate_release_notes: true
